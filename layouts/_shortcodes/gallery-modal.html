{{- /* Renders the dialog that gallery-script shows full-size gallery
       images in. It's only shown by gallery-script, so use them together. */ -}}
<dialog id="myModal" class="modal" aria-labelledby="caption">
    <button type="button" class="close" aria-label="{{ i18n "close" | default "Close" }}">&times;</button>
    <img class="modal-content" id="modal-img" alt="">
    <div id="caption"></div>
    <div id="loader"></div>
</dialog>
