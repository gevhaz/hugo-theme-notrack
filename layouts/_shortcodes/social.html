{{- /* Renders a row of links to the sites in site.Params.social, or
       nothing if there are none. */ -}}
{{ with site.Params.social }}
    <div class="social">
        <ul>
            {{ partial "social-links.html" . }}
        </ul>
    </div>
{{ end }}
