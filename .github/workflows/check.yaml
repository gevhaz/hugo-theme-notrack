---
name: Check

on:
  pull_request:
    branches: ["master"]

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: gevhaz/word-warden@v1.1.0
        with:
          preprocessing_script: .github/scripts/preprocess-for-spellchecking.sed
          files: "**/!(tempora-maxime|lorem|id-modi|LICENSE).md"

  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run linkspector
        uses: umbrelladocs/action-linkspector@v1.5.5
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          filter_mode: nofilter
          fail_level: any

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run mdl
        uses: actionshub/markdownlint@main
        with:
          filesToIgnoreRegex: "(exampleSite/content/|archetypes).*"

  i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Check that template fallbacks match i18n/en.yaml
        run: .github/scripts/check-i18n-fallbacks.py

  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          set -x
          hugo \
            --minify \
            --baseURL grotius.example.com \
            --theme hugo-theme-notrack/ \
            --themesDir ../../ \
            --printUnusedTemplates \
        working-directory: ./exampleSite

  visual-diff:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      # The pages to compare, each as <screenshot name>=<path>
      PAGES: |
        home=/
        markdown=/blog/2019/03/markdown-syntax-guide/
        resume=/resume/
        blog=/blog/
        hugo-gallery=/hugo-gallery/
        contact=/contact/
        categories=/categories/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build master branch version
        run: |
          git checkout master
          hugo -d public-master \
            --theme hugo-theme-notrack/ \
            --themesDir ../../
        working-directory: ./exampleSite
      - name: Build pull request version
        run: |
          git checkout ${{ github.head_ref }}
          hugo -d public-pr \
            --theme hugo-theme-notrack/ \
            --themesDir ../../
        working-directory: ./exampleSite
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install playwright and its dependencies
        run: |
          npm init -y
          npm install playwright http-server
          npx playwright install
      - name: Serve both versions and wait for them to be ready
        run: |
          npx http-server ./exampleSite/public-master -p 8080 &
          npx http-server ./exampleSite/public-pr -p 8081 &
          sleep 15

      - name: Take screenshots of various pages on version with and without new changes
        run: |
          for page in $PAGES; do
            name=${page%%=*}
            path=${page#*=}
            # Fail on a page that doesn't exist, rather than compare two 404s
            curl --fail --silent --show-error --output /dev/null "http://localhost:8081$path"
            npx playwright screenshot --full-page "http://localhost:8080$path" "master-$name.png"
            npx playwright screenshot --full-page "http://localhost:8081$path" "pr-$name.png"
          done
      - name: Equalize screenshots size
        run: |
          for pr in pr-*.png; do
            master=master-${pr#pr-}
            echo "Equalize height of screenshots $pr and $master..."
            HEIGHT_PR=$(identify-im6.q16 -format "%h" "$pr")
            HEIGHT_MASTER=$(identify-im6.q16 -format "%h" "$master")
            MAX_HEIGHT=$((HEIGHT_PR > HEIGHT_MASTER ? HEIGHT_PR : HEIGHT_MASTER))
            convert-im6.q16 "$pr" -background white -extent x${MAX_HEIGHT} "$pr"
            convert-im6.q16 "$master" -background white -extent x${MAX_HEIGHT} "$master"
          done
      - name: Compare screenshots
        id: diff
        run: |
          mkdir diffs
          has_any_changes=false
          for pr in pr-*.png; do
            screenshot=${pr#pr-}
            echo "Comparing files $pr and master-$screenshot..."
            if npx pixelmatch "master-$screenshot" "$pr" "diffs/$screenshot" 0.1; then
              echo 'No changes detected'
            else
              echo 'Changes detected'
              has_any_changes=true
            fi
          done
          echo "has_changes=${has_any_changes}" >> $GITHUB_OUTPUT
      - name: Upload diff images
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visuals-diffs
          path: diffs/
      - name: Comment on PR
        uses: actions/github-script@v9
        if: steps.diff.outputs.has_changes == 'true'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Visual changes detected! Check artifacts for diffs.'
            })
